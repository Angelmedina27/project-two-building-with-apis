{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="card bg-base-100 shadow max-w-md mx-auto">
  <div class="card-body">
    <h1 class="card-title text-2xl">Create an account</h1>
    <form method="post" action="{% url 'signup' %}" class="flex flex-col gap-2">
      {% csrf_token %}
      {% include "_form_fields.html" %}
      <button type="submit" class="btn btn-primary mt-2">Sign up</button>
    </form>
    <p class="text-sm mt-2">Already have an account? <a href="{% url 'login' %}" class="link link-primary">Log in</a></p>
  </div>
</div>
{% endblock %}
