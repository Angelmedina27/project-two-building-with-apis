{% load watchlist_tags %}{% if item.poster_path %}<img src="https://image.tmdb.org/t/p/{{ size }}{{ item.poster_path }}" alt="Poster for {{ item.title }}" loading="lazy" class="{{ classes }} rounded-md object-cover bg-base-300" onerror="this.hidden = true; this.nextElementSibling.hidden = false;">{% endif %}<div class="{{ classes }} rounded-md bg-neutral text-neutral-content text-xs flex items-center justify-center font-bold"{% if item.poster_path %} hidden{% endif %} aria-hidden="true"><span>{{ item.title|initials }}</span></div>
