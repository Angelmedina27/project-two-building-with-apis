[project]
name = "project-two-building-with-apis"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.3,<6.2",
    "djangorestframework>=3.18.3",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytailwindcss>=0.4.2",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "responses>=0.26.3",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
